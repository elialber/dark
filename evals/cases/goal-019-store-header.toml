No armazenamento de agregados (src/dark/store/core.py), abrir um
arquivo lê o cabeçalho (application id, versão do esquema e número de
tabelas) em três comandos separados, cada um na sua transação. Se outro
processo cria o esquema entre essas leituras, o primeiro vê id 0 com
tabelas e recusa o arquivo como estranho. Isso apareceu no Windows, na
CI.

Faça a leitura do cabeçalho ver um único estado do arquivo, de modo que
uma criação concorrente não pareça corrupção. O teste
test_header_is_read_in_one_snapshot, em tests/test_store.py, reproduz a
corrida de forma determinística; faça-o passar sem enfraquecê-lo, e os
demais testes do arquivo devem continuar passando.
"""
