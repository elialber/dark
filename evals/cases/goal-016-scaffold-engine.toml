prompt = """
Crie o motor do scaffold em src/dark/scaffold/: o mecanismo que aplica
mudanças a um repositório qualquer, de forma não destrutiva, idempotente
e reversível, registrando tudo em um manifesto. Ele não pode supor nada
sobre o repositório além de ser um diretório, e só usa a biblioteca
padrão.

Operações: criar arquivo; criar diretório; acrescentar uma entrada em um
arquivo JSON, em um caminho de chaves; acrescentar uma linha a um arquivo
de texto se ainda não existir; inserir um bloco delimitado por marcadores
em um arquivo de texto.

Ciclo: o plano (lista de operações) pode ser inspecionado sem alterar
nada; a aplicação é tudo ou nada; o manifesto, um arquivo no repositório,
registra cada operação aplicada com o necessário para desfazê-la e a
versão de quem a pediu; a reversão desfaz exatamente o que o manifesto
registra.

Garantias: nunca sobrescreve conteúdo diferente (conflito, nada
aplicado); aplicar de novo não muda nada; aplicar e reverter deixa a
árvore idêntica byte a byte, inclusive em JSON existente; edição do
usuário em algo aplicado é respeitada na reversão; caminho que sai do
repositório (`..`, absoluto, link simbólico) é recusado; quebras de
linha, ausência de quebra no fim e codificação são mantidas; reverter um
módulo não afeta o que outro aplicou. Um módulo declara nome, versão,
plano, verificação e o indicador que pretende melhorar. Há também um
comando mínimo, com mensagens em português, para inspecionar, aplicar e
reverter um plano descrito em arquivo.

Os testes de tests/test_scaffold.py já existem e definem nomes e
interface; faça todos passarem.
"""
notes = """
