prompt = """
Acrescente ao pacote src/dark/evals/ o executor de evals: roda o agente
(Claude Code em modo não interativo) sobre um caso e diz se ele resolveu.

Uma execução: cópia limpa do repositório no commit base do caso, nunca o
repositório de origem; condição `bare` (sem CLAUDE.md, .claude/ nem
.mcp.json) ou `project`; diretório de configuração e home descartáveis;
o agente com limite de turnos, de tempo e de tokens, processo e filhos
encerrados ao estourar; depois o aceite, com os arquivos de teste do caso
trazidos por cima do que o agente fez. O registro de cada execução leva
só números e identificadores, nunca texto da conversa, tem esquema
declarado e fica fora do repositório. Cópia e configuração são apagadas
no fim, também em erro ou interrupção.

Uma rodada: casos por condições por N execuções, com teto de tokens da
rodada, modo de calibração (uma execução por caso e condição) e resumo.
O lançador do agente é injetável; nada nos testes abre sessão real. Só a
biblioteca padrão.

Os testes de tests/test_evals_runner.py já existem e definem nomes e
interface; faça todos passarem.
"""
